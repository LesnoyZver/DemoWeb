<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход в админку</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="admin-login" data-page="admin-login">
  <main class="login-wrap">
    <div class="login-card">
      <a class="logo" href="/">{% if SHOP_NAME %}{{ SHOP_NAME }}<span>.</span>{% endif %}</a>
      <p class="eyebrow">Админ-панель</p>
      <h1 class="login-title">Вход</h1>
      <p class="login-text">Введите пароль администратора из файла <code>.env</code>.</p>

      {% if error %}
        <p class="alert alert--error">{{ error }}</p>
      {% endif %}

      <form method="post" action="/admin/login" class="login-form">
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="current-password"
                 autofocus required>
        </div>
        <button class="btn btn-primary btn-wide" type="submit">Войти</button>
      </form>

      <a class="text-link" href="/">← Вернуться на сайт</a>
    </div>
  </main>
</body>
</html>
