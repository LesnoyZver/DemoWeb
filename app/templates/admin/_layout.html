<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Админка{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="admin" data-page="admin">
  <div class="admin-shell">
    <aside class="admin-side">
      <a class="logo" href="/admin/dashboard">{% if SHOP_NAME %}{{ SHOP_NAME }}<span>.</span>{% endif %}</a>
      <p class="admin-side__label">Админ-панель</p>
      <nav class="admin-nav" aria-label="Админ-навигация">
        <a class="{% if active == 'dashboard' %}is-active{% endif %}" href="/admin/dashboard">Дашборд</a>
        <a class="{% if active == 'products' %}is-active{% endif %}" href="/admin/products">Товары</a>
        <a class="{% if active == 'categories' %}is-active{% endif %}" href="/admin/categories">Категории</a>
        <a class="{% if active == 'orders' %}is-active{% endif %}" href="/admin/orders">Заказы</a>
      </nav>
      <div class="admin-side__bottom">
        <a class="text-link" href="/" target="_blank" rel="noopener">Открыть сайт ↗</a>
        <form method="post" action="/admin/logout">
          <button class="btn btn-ghost btn-small" type="submit">Выйти</button>
        </form>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <h1 class="admin-heading">{% block heading %}{% endblock %}</h1>
        {% block topbar_actions %}{% endblock %}
      </header>
      <div class="admin-content">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
  <script src="/static/js/app.js" defer></script>
</body>
</html>
